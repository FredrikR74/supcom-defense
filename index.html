<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupCom Defense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="resources"></div>
    <div id="hover"></div>
    <div id="selection-box" hidden></div>
    <div id="commands" hidden></div>
    <div id="threat"></div>
    <div id="info" hidden></div>
    <div id="idle" hidden></div>
    <div id="toast" hidden></div>
    <div id="mode-hint" hidden>Patrol: click a point · Shift adds more · Esc cancels</div>
    <div id="gameover" hidden>
      <div class="gameover-title">Defeat</div>
      <div class="gameover-sub">The Quantum Gate has been destroyed</div>
      <div class="gameover-time"></div>
      <button class="gameover-restart">Restart</button>
    </div>
    <div id="debug" hidden></div>
    <div id="minimap"></div>
    <div id="speed" hidden></div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
